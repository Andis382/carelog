# WhatsApp messages to circle members. A line whose placeholders all come out empty is dropped.
msg.weekly_summary=CareLog weekly summary for {elder}, {week}\n\n{doses}\n{problems}\n{vitals}\n{meals}\n{notes}\n{supplies}\n{hours}\n\nThis is a summary of what the care circle wrote down. It does not replace being there, and a call from you still means more than any note.\n{link}
msg.supplies_low=Hi {name}. {by} marked in CareLog: {supply} – {state}. Could you arrange more? {link}
msg.shift_swap_request=Hi {name}. {from} asks if you can take a shift: {date}, {time}. {message}\nAnswer in CareLog: {link}
msg.dose_missed={elder}: the {time} dose of {medicine} has not been recorded and is now more than 2 hours late. If it was given, please tick it in CareLog: {link}

